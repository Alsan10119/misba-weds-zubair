<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Shimmer & 3D Lighting Gradients -->
    <linearGradient id="goldCarveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd"/>
      <stop offset="20%" stop-color="#d4af37"/>
      <stop offset="45%" stop-color="#9a7418"/>
      <stop offset="65%" stop-color="#f5e08b"/>
      <stop offset="85%" stop-color="#c59b27"/>
