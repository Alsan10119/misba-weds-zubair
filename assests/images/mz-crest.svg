<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5d6" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#805b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aa7e1d"/>
      <stop offset="25%" stop-color="#fdf1c2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#aa7e1d"/>
      <stop offset="100%" stop-color="#f5e08b"/>
    </linearGradient>
    <linearGradient id="burgundyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e0e18"/>
      <stop offset="50%" stop-color="#46060c"/>
      <stop offset="100%" stop-color="#2a0206"/>
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Medallion -->
  <circle cx="120" cy="120" r="108" fill="url(#burgundyGradient)" stroke="url(#goldGradient)" stroke-width="4" filter="url(#sealShadow)"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="120" cy="120" r="92" fill="url(#goldGlow)"/>

  <!-- Ornate Baroque Filigree & Floral Wreath Frame -->
  <g fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Crown / Flourish -->
    <path d="M 120 22 C 114 34 100 36 94 44 C 104 46 112 40 120 48 C 128 40 136 46 146 44 C 140 36 126 34 120 22 Z" fill="url(#goldGradient)"/>
    <circle cx="120" cy="20" r="3" fill="url(#goldGradient)"/>

    <!-- Bottom Flourish -->
    <path d="M 120 218 C 114 206 100 204 94 196 C 104 194 112 200 120 192 C 128 200 136 194 146 196 C 140 204 126 206 120 218 Z" fill="url(#goldGradient)"/>
    <circle cx="120" cy="220" r="3" fill="url(#goldGradient)"/>

    <!-- Left Wreath Scrollwork -->
    <path d="M 94 44 C 70 54 48 76 40 102 C 34 122 36 144 48 162 C 60 178 76 190 94 196"/>
    <path d="M 88 56 C 68 70 56 90 52 112 C 50 130 54 148 64 162 C 72 174 82 182 92 188"/>
    
    <!-- Left Leaves & Tendrils -->
    <path d="M 46 88 C 34 86 28 94 36 100 C 42 98 44 92 46 88 Z" fill="url(#goldGradient)"/>
    <path d="M 38 120 C 26 120 22 130 30 134 C 36 130 36 124 38 120 Z" fill="url(#goldGradient)"/>
    <path d="M 48 152 C 36 156 34 166 42 168 C 48 162 46 156 48 152 Z" fill="url(#goldGradient)"/>

    <!-- Right Wreath Scrollwork -->
    <path d="M 146 44 C 170 54 192 76 200 102 C 206 122 204 144 192 162 C 180 178 164 190 146 196"/>
    <path d="M 152 56 C 172 70 184 90 188 112 C 190 130 186 148 176 162 C 168 174 158 182 148 188"/>

    <!-- Right Leaves & Tendrils -->
    <path d="M 194 88 C 206 86 212 94 204 100 C 198 98 196 92 194 88 Z" fill="url(#goldGradient)"/>
    <path d="M 202 120 C 214 120 218 130 210 134 C 204 130 204 124 202 120 Z" fill="url(#goldGradient)"/>
    <path d="M 192 152 C 204 156 206 166 198 168 C 192 162 194 156 192 152 Z" fill="url(#goldGradient)"/>
  </g>

  <!-- Central Cursive Calligraphy 'MZ' Matching PDF Page 5 -->
  <g fill="url(#goldGradient)" stroke="#fff5d6" stroke-width="0.75" filter="url(#sealShadow)">
    <!-- Letter M in Victorian / Wedding Calligraphy Script -->
    <path d="M 76 138 C 74 134 76 126 80 114 C 86 96 94 76 102 76 C 108 76 106 86 102 98 L 96 118 C 94 126 92 134 96 134 C 100 134 106 126 114 106 C 120 90 126 78 132 78 C 138 78 136 88 132 102 L 126 122 C 124 130 122 138 126 138 C 130 138 136 128 140 120 C 142 122 140 126 136 132 C 130 142 120 146 114 146 C 104 146 104 134 108 120 L 114 100 C 110 112 104 128 98 138 C 92 148 84 148 78 144 C 76 142 76 140 76 138 Z"/>
    
    <!-- Letter Z in Elegant Intertwined Script -->
    <path d="M 132 108 C 136 104 146 100 156 100 C 168 100 174 106 172 114 C 170 122 160 130 148 140 L 138 148 C 134 152 136 156 142 156 C 150 156 160 150 166 144 L 168 148 C 160 158 146 164 136 164 C 126 164 122 154 126 144 C 128 138 136 130 146 120 C 154 112 158 108 156 106 C 154 104 146 106 138 112 L 132 108 Z"/>
  </g>
</svg>
